<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 610" width="820" height="610" role="img" aria-labelledby="t d" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <title id="t">Architecture of the Jira computer-use test runner</title>
  <desc id="d">Test cases are fetched from Jira with a JQL query by a local Node.js runner. The runner sends one step at a time to an OpenAI hosted agent session that uses GPT-6.1 Sol and the computer use tool to drive an OpenAI-hosted browser on a public demo site. Pass or fail verdicts and screenshots come back to the runner, which writes JSON and HTML reports and attaches them to a Jira execution issue. Settings and secrets live in a local config file that is never committed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
  </defs>

  <rect width="820" height="610" rx="10" fill="#ffffff"/>

  <!-- Jira: test issues -->
  <rect x="20" y="60" width="150" height="80" rx="8" fill="#e8f0fe" stroke="#2f6fdb" stroke-width="1.5"/>
  <text x="95" y="80" text-anchor="middle" font-size="10.5" fill="#52606d">Jira Cloud</text>
  <text x="95" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Test issues</text>
  <text x="95" y="116" text-anchor="middle" font-size="11" fill="#1f2933">numbered steps in</text>
  <text x="95" y="130" text-anchor="middle" font-size="11" fill="#1f2933">plain English</text>

  <!-- Jira: execution issue -->
  <rect x="20" y="402" width="150" height="80" rx="8" fill="#e8f0fe" stroke="#2f6fdb" stroke-width="1.5"/>
  <text x="95" y="422" text-anchor="middle" font-size="10.5" fill="#52606d">Jira Cloud</text>
  <text x="95" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Execution issue</text>
  <text x="95" y="458" text-anchor="middle" font-size="11" fill="#1f2933">report.html + .json</text>
  <text x="95" y="472" text-anchor="middle" font-size="11" fill="#1f2933">comment + label</text>

  <!-- Local runner -->
  <rect x="260" y="30" width="260" height="470" rx="10" fill="#eef8f1" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="390" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="#1d5c3a">Local Node.js runner</text>

  <rect x="276" y="70" width="228" height="60" rx="6" fill="#ffffff" stroke="#2e8b57"/>
  <text x="390" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Fetch tests</text>
  <text x="390" y="114" text-anchor="middle" font-size="11" fill="#1f2933">JQL result saved as tests.json</text>

  <rect x="276" y="170" width="228" height="96" rx="6" fill="#ffffff" stroke="#2e8b57"/>
  <text x="390" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Run tests</text>
  <text x="390" y="215" text-anchor="middle" font-size="11" fill="#1f2933">one step per message</text>
  <text x="390" y="232" text-anchor="middle" font-size="11" fill="#1f2933">site allowlist</text>
  <text x="390" y="249" text-anchor="middle" font-size="11" fill="#1f2933">sign-in handling</text>

  <rect x="276" y="306" width="228" height="66" rx="6" fill="#ffffff" stroke="#2e8b57"/>
  <text x="390" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Write reports</text>
  <text x="390" y="349" text-anchor="middle" font-size="11" fill="#1f2933">report.json, report.html</text>
  <text x="390" y="364" text-anchor="middle" font-size="11" fill="#1f2933">and a screenshot per step</text>

  <rect x="276" y="412" width="228" height="60" rx="6" fill="#ffffff" stroke="#2e8b57"/>
  <text x="390" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Publish</text>
  <text x="390" y="456" text-anchor="middle" font-size="11" fill="#1f2933">attach, comment, label</text>

  <!-- Arrows inside the runner -->
  <line x1="390" y1="130" x2="390" y2="168" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="266" x2="390" y2="304" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="372" x2="390" y2="410" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 1: fetch -->
  <line x1="170" y1="100" x2="274" y2="100" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2933">1 JQL via</text>
  <text x="215" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2933">REST API</text>

  <!-- 5: write back -->
  <line x1="276" y1="442" x2="172" y2="442" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="432" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2933">5 write</text>
  <text x="215" y="464" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2933">back</text>

  <!-- OpenAI -->
  <rect x="610" y="150" width="190" height="250" rx="10" fill="#f3eefb" stroke="#6f4cc2" stroke-width="1.5"/>
  <text x="705" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4a2f94">OpenAI Agents API (beta)</text>

  <rect x="626" y="190" width="158" height="90" rx="6" fill="#ffffff" stroke="#6f4cc2"/>
  <text x="705" y="214" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Hosted agent session</text>
  <text x="705" y="238" text-anchor="middle" font-size="11" fill="#1f2933">GPT-6.1 Sol</text>
  <text x="705" y="255" text-anchor="middle" font-size="11" fill="#1f2933">+ computer use tool</text>

  <rect x="626" y="320" width="158" height="64" rx="6" fill="#ffffff" stroke="#6f4cc2"/>
  <text x="705" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Hosted browser</text>
  <text x="705" y="364" text-anchor="middle" font-size="11" fill="#1f2933">click, type, screenshot</text>

  <line x1="705" y1="280" x2="705" y2="318" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2 and 3: runner <-> agent -->
  <line x1="504" y1="205" x2="624" y2="205" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="565" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2933">2 step text</text>
  <line x1="626" y1="245" x2="506" y2="245" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="565" y="263" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2933">3 verdict +</text>
  <text x="565" y="277" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2933">screenshot</text>

  <!-- Target site -->
  <rect x="610" y="450" width="190" height="60" rx="8" fill="#fff4e0" stroke="#d08a1e" stroke-width="1.5"/>
  <text x="705" y="474" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2933">Public demo site</text>
  <text x="705" y="494" text-anchor="middle" font-size="11" fill="#1f2933">the-internet.herokuapp.com</text>
  <line x1="705" y1="384" x2="705" y2="448" stroke="#52606d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="715" y="424" font-size="11" font-weight="700" fill="#1f2933">4 browses</text>

  <!-- Config -->
  <rect x="150" y="536" width="500" height="52" rx="8" fill="#f5f7fa" stroke="#7b8794" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="400" y="558" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2933">config/.env</text>
  <text x="400" y="576" text-anchor="middle" font-size="11" fill="#1f2933">API keys, Jira URL and token, JQL, allowed sites. Never committed.</text>
  <line x1="390" y1="536" x2="390" y2="502" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
